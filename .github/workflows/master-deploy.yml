name: Build Android APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: |
          cp .env.example .env
          npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sinkronisasi Capacitor
        run: npx cap sync android

      - name: Run Signing Report (Untuk Ambil SHA-1)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew signingReport
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: Cubic123!
          KEY_ALIAS: cubicbaru_key
          KEY_PASSWORD: Cubic123!

      - name: Build APK (Mode Release)
        working-directory: ./android
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: Cubic123!
          KEY_ALIAS: cubicbaru_key
          KEY_PASSWORD: Cubic123!

      - name: Upload Release APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CUBIC-RELEASE-APK
          path: android/app/build/outputs/apk/release/app-release.apk
